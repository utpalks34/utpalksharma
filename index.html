<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Utpal Kant Sharma — AI &amp; Backend Engineer</title>
  <meta name="description" content="Utpal Kant Sharma — AI and backend engineer building agentic systems: LangGraph pipelines, retrieval-augmented assistants and Django/FastAPI services. Based in Guwahati, Assam.">
  <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:,">

  <!-- Prevent theme flicker -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uks-theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preload" href="./fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="bg-[#07080c] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
